<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#C4DFEF" />
  <meta name="description" content="You are being called. An invitation from the BLD Lipa Youth Ministry — The Emergence." />

  <!-- Open Graph (FR-40) -->
  <meta property="og:title"       content="The Emergence — BLD Lipa Youth Ministry" />
  <meta property="og:description" content="There is a stirring. You are being called to discern, to lead, and to belong." />
  <meta property="og:image"       content="public/bldym-logo.jpg" />
  <meta property="og:type"        content="website" />

  <title>The Emergence — BLD Lipa Youth Ministry</title>

  <!-- PWA manifest (FR-45) -->
  <link rel="manifest" href="manifest.json" />

  <!-- Preload anchor photos (NFR-04b) — JS will also do this, but link preload fires earlier -->
  <link rel="preload" as="image" href="public/penta-1.jpg" />
  <link rel="preload" as="image" href="public/penta-2.jpg" />
  <link rel="preload" as="image" href="public/penta-3.jpg" />
  <link rel="preload" as="image" href="public/penta-4.jpg" />
  <link rel="preload" as="image" href="public/penta-5.jpg" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Ambient background slideshow (FR-17b) -->
  <div id="ambient-bg" role="presentation" aria-hidden="true"></div>

  <!-- Main stage -->
  <main id="stage" aria-label="BLD Lipa Youth Ministry invitation">

    <!-- Polaroid scatter area (Stage 1–3) -->
    <section id="polaroid-area" aria-hidden="true">
      <!-- Polaroid cards injected by animation.js -->
    </section>

    <!-- Photo grid (Stage 4 / final state) -->
    <section id="photo-grid" aria-label="Community photos">
      <!-- Grid items injected by animation.js -->
    </section>

    <!-- Invitation message (Stage 5 / final state) -->
    <article id="invitation" aria-live="polite">
      <!-- Lines injected by animation.js -->

      <!-- Logo revealed at the end -->
      <div id="logo-wrap" aria-label="BLD Lipa Youth Ministry">
        <img src="public/bldym-logo.jpg" alt="BLD Lipa Youth Ministry logo" />
      </div>
    </article>

  </main>

  <!-- Config must load before animation -->
  <script src="config.js"></script>
  <script src="animation.js"></script>
</body>
</html>
